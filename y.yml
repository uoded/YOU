# PARTIE AA — FILES / QUEUES CELERY

## 89. Séparer les queues

Recommandation :

```text
fmg_extraction
cache
maintenance
notifications
```

Par exemple :

```text
extract_daily_rules → fmg_extraction

refresh_rules_cache → cache

reconcile_rules_cache → cache ou maintenance

cleanup_daily_rules → maintenance
```

Cela évite qu’un long cleanup bloque les extractions.

