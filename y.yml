# PARTIE AB — MÉMOIRE ET PERFORMANCE

## 90. Ne traiter qu'un gros JSON à la fois

Un JSON de 8 Mo compressé/réseau peut devenir beaucoup plus gros sous forme d’objets Python.

Donc :

```text
GET ADOM
validate
save
release references

puis ADOM suivant
```

Même principe pour Redis.

---

## 91. Benchmarker le `JSONField`

Avant production, mesurer :

```text
temps INSERT/UPDATE
temps SELECT
CPU sérialisation
RAM worker
taille DB
temps backup
```

Avec ton ordre de grandeur :

```text
~8 Mo / ADOM
~80 ADOMs / FMG
≈640 Mo brut / FMG
```

plus les index, métadonnées et overhead MySQL.

---

## 92. Vérifier la configuration MySQL

Notamment :

```text
max_allowed_packet
timeouts
taille des connexions
espace disque
backup
```

