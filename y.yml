## 114. Les deux seules familles de locks

Finalement :

```text
1. lock extraction
lock:daily-policy-sync:extraction:fmg:{uid}
```

utilisé uniquement par notre extraction.

Et :

```text
2. lock cache
lock:daily-policy-sync:cache:fmg:{uid}:adom:{name}
```

utilisé par :

```text
refresh_rules_cache
reconcile_rules_cache
```

Pas besoin d’un lock différent pour chacune des quatre tâches.

---

## 115. Principe de sécurité final vis-à-vis du legacy

On peut résumer toute la stratégie par :

```text
Nouvelle fonctionnalité
       │
       ├── nouveaux modèles
       ├── nouvelles tâches
       ├── nouveaux locks
       ├── nouveau namespace Redis
       ├── nouveaux timeouts
       ├── nouveaux retries
       └── éventuellement nouveau client FMG
```

et :

```text
Legacy
       │
       └── INCHANGÉ
```

C’est cette séparation qui doit guider toute l’implémentation.

Le plan final contient donc **4 tâches Celery, 2 familles de locks, un stockage MySQL par ADOM en `JSONField`, un cache Redis versionné et entièrement reconstructible, un nettoyage tolérant aux suppressions de FortiManager via `SET_NULL`, et aucun mécanisme global susceptible de modifier le comportement historique du projet.**
