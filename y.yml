# PARTIE AE — CE QUE NOUS N'IMPLÉMENTONS PAS

## 109. Pas de protection bloquante sur baisse massive d'ADOMs

Nous n’implémentons pas :

```text
si -70 % ADOMs
→ arrêter sync
```

Non.

Nous faisons seulement :

```text
traitement normal
+
signalement mail final
```

---

## 110. Pas de heartbeat du lock

Nous n’implémentons pas :

```text
renouvellement automatique du TTL
heartbeat
watchdog du lock
```

Le TTL est simplement suffisamment large.

---

## 111. Pas de modification du legacy

Nous n’implémentons pas de mécanisme global qui forcerait les anciennes tâches à utiliser :

```text
nos locks
nos timeouts
nos retries
nos caches
```

---

## 112. Pas de suppression générique Redis

Interdit :

```text
KEYS *
FLUSHDB
DEL générique
SCAN puis suppression sans namespace précis
```

Notre fonctionnalité ne touche qu’à :

```text
daily-policy-sync:*
```

