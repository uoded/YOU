# PARTIE AC — FUTURE API DRF

## 93. L'API doit privilégier Redis

Flux futur :

```text
GET rules
    ↓
ADOM demandé
    ↓
Redis current existe et valide ?
    ├── oui → Redis
    └── non → MySQL
```

---

## 94. MySQL doit permettre le fallback

Même si Redis est down :

```text
API → MySQL rules JSON
```

La fonctionnalité reste disponible, éventuellement plus lentement.

---

## 95. Exposer l'âge des données

Si aujourd’hui l’extraction échoue mais que les données d’hier existent :

```text
sync_status = FAILED
rules = données valides d'hier
```

L’API pourra renvoyer :

```json
{
  "sync_status": "FAILED",
  "last_success_at": "...",
  "data_version": "...",
  "rules_count": 8127,
  "rules": [...]
}
```

Ainsi le client sait que les données sont disponibles mais pas issues du dernier run réussi.

