Oui. Voici le **plan complet, consolidé et à jour**, dans l’esprit du premier plan à 35 étapes, mais cette fois en intégrant toutes les décisions prises ensuite : modèle complet, stockage par ADOM en `JSONField`, policy packages, retries, locks strictement isolés du legacy, cache Redis versionné, réconciliation, suppression des ADOMs orphelins avec `SET_NULL`, mail final, et les éléments explicitement exclus.

# 1. Objectif global de la fonctionnalité

La fonctionnalité doit, chaque jour à 14h02 :

```text
FortiManager
    ↓
récupération des ADOMs
    ↓
récupération des policy packages de chaque ADOM
    ↓
récupération des rules
    ↓
validation
    ↓
stockage MySQL par ADOM dans un JSONField
    ↓
fin complète de l'extraction
    ↓
construction du cache Redis
```

À côté de ce flux principal, deux tâches périodiques assurent :

```text
réparation du cache Redis
```

et :

```text
nettoyage des ADOMs / caches devenus orphelins
```

On aura donc **4 tâches Celery principales** :

```text
1. extract_daily_rules
2. refresh_rules_cache
3. reconcile_rules_cache
4. cleanup_daily_rules
```

La règle absolue de conception est :

```text
cette nouvelle fonctionnalité doit être isolée du legacy
```

Elle ne doit jamais :

```text
modifier une ancienne tâche
modifier un ancien timeout
modifier un ancien retry
utiliser un ancien lock
supprimer un ancien cache Redis
écraser une ancienne clé Redis
modifier le fonctionnement historique du projet
```

---

# 2. Architecture logique finale

Le flux principal est :

```text
Celery Beat - 14:02
        ↓
extract_daily_rules
        ↓
FortiManagers actifs
        ↓
FMG par FMG
        ↓
ADOM par ADOM
        ↓
Package par package
        ↓
GET policies complet
        ↓
validation
        ↓
MySQL
        ↓
TOUTE l'extraction terminée
        ↓
refresh_rules_cache
        ↓
Redis
        ↓
mail final
```

En parallèle :

```text
reconcile_rules_cache
        ↓
vérifie MySQL ↔ Redis
        ↓
répare si nécessaire
```

et :

```text
cleanup_daily_rules
        ↓
ADOMs disparus
FMG supprimés
versions Redis abandonnées
        ↓
nettoyage
```

---

# 3. MySQL est la source de vérité

Redis ne doit jamais devenir la source officielle.

La hiérarchie est :

```text
FortiManager
   ↓
MySQL
   ↓
Redis
```

Donc :

```text
FortiManager = source externe
MySQL = source persistante de vérité
Redis = accélérateur reconstructible
```

Si Redis disparaît complètement :

```text
MySQL
  ↓
reconcile_rules_cache
  ↓
Redis reconstruit
```

Aucun nouvel appel FortiManager n'est nécessaire.

---

# 4. Un enregistrement MySQL correspond à un ADOM

Le stockage principal sera :

```text
1 ligne = 1 FortiManager + 1 ADOM
```

Exemple :

```text
FMG-PARIS
 ├── PROD → JSONField
 ├── DMZ  → JSONField
 ├── DEV  → JSONField
 └── TEST → JSONField
```

On ne stocke donc pas les 80 ADOMs d'un FortiManager dans un seul énorme JSON.

---

# 5. Relation entre FortiManager et ADOM

On utilisera :

```python
ForeignKey
```

et non `OneToOneField`.

Mais avec :

```python
on_delete=models.SET_NULL
```

pour éviter que la suppression d'un FortiManager supprime immédiatement les ADOMs avant que Redis puisse être nettoyé.

Exemple :

```python
fortimanager = models.ForeignKey(
    "FortiManager",
    on_delete=models.SET_NULL,
    null=True,
    blank=True,
    related_name="daily_policy_adoms",
)
```

Si le FortiManager est supprimé :

```text
FortiManager supprimé
        ↓
ADOM reste en base
        ↓
fortimanager = NULL
        ↓
cleanup_daily_rules
        ↓
suppression Redis
        ↓
suppression ADOM
```

---

# 6. Conserver un identifiant historique du FortiManager

`SET_NULL` fait perdre la FK.

Il faut donc conserver un identifiant stable :

```python
source_fmg_uid = models.UUIDField(
    editable=False,
)
```

Cet identifiant est copié depuis le FortiManager à la création de l'ADOM.

Il ne change jamais.

Exemple après suppression du FMG :

```text
fortimanager = NULL
source_fmg_uid = "44f9..."
name = "PROD"
```

On peut toujours retrouver :

```text
daily-policy-sync:fmg:44f9...:adom:PROD:...
```

dans Redis.

---

# 7. Ajouter un UUID stable au FortiManager

Si le modèle existant le permet sans impact legacy, ajouter :

```python
uid = models.UUIDField(
    default=uuid.uuid4,
    unique=True,
    editable=False,
)
```

On utilisera ce `uid` pour :

```text
identité persistante
clés Redis
locks
audit
source_fmg_uid
```

Il vaut mieux éviter de dépendre uniquement du `pk` numérique Django.

---

# 8. Modèle `Adom` complet final

Voici une proposition complète :

```python
import uuid

from django.db import models


class Adom(models.Model):

    class SyncStatus(models.TextChoices):
        SUCCESS = "SUCCESS", "Success"
        FAILED = "FAILED", "Failed"
