```text
                        CELERY BEAT
                            │
                         14:02
                            │
                            ▼
                   extract_daily_rules
                            │
                            ▼
                       SyncRun
                       RUNNING
                            │
                            ▼
                    FMG actifs
                            │
                   ┌────────┴────────┐
                   │                 │
                  FMG1              FMG2
                   │                 │
              lock feature      lock feature
                   │                 │
                   ▼                 ▼
             liste ADOMs        liste ADOMs
                   │
                   ▼
            ADOM séquentiel
                   │
                   ▼
              liste packages
                   │
                   ▼
            package par package
                   │
                   ▼
             GET policies
                   │
                   ▼
