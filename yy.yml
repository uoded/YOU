    sync_status = models.CharField(
        max_length=32,
        choices=SyncStatus.choices,
        default=SyncStatus.SUCCESS,
    )

    failure_reason = models.TextField(
        blank=True,
        default="",
    )

    failed_packages = models.JSONField(
        default=list,
        blank=True,
    )

    package_count = models.PositiveIntegerField(
        default=0,
    )

    successful_package_count = models.PositiveIntegerField(
        default=0,
    )

    failed_package_count = models.PositiveIntegerField(
        default=0,
    )

    rules_count = models.PositiveIntegerField(
        default=0,
    )

    data_version = models.CharField(
        max_length=64,
        blank=True,
        default="",
    )

    cache_version = models.CharField(
        max_length=64,
        blank=True,
        default="",
    )

    last_seen_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    last_attempt_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    last_success_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    last_failed_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    consecutive_missing_count = models.PositiveIntegerField(
        default=0,
    )

    is_active = models.BooleanField(
        default=True,
    )

    deleted_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    created_at = models.DateTimeField(
        auto_now_add=True,
    )

    updated_at = models.DateTimeField(
        auto_now=True,
    )

    class Meta:
        constraints = [
            models.UniqueConstraint(
                fields=["source_fmg_uid", "name"],
                name="uniq_daily_policy_fmg_adom",
            ),
        ]

        indexes = [
            models.Index(
                fields=["source_fmg_uid", "name"],
            ),
            models.Index(
                fields=["sync_status"],
            ),
            models.Index(
