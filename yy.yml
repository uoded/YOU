# 12. Ajouter un modèle `SyncRun`

Le `SyncRun` représente une exécution complète quotidienne.

Exemple :

```python
class SyncRun(models.Model):

    class Status(models.TextChoices):
        PENDING = "PENDING", "Pending"
        RUNNING = "RUNNING", "Running"
        READY_FOR_CACHE = "READY_FOR_CACHE", "Ready for cache"
        CACHE_RUNNING = "CACHE_RUNNING", "Cache running"
        SUCCESS = "SUCCESS", "Success"
        PARTIAL = "PARTIAL", "Partial"
        FAILED = "FAILED", "Failed"
        SKIPPED_LOCKED = "SKIPPED_LOCKED", "Skipped locked"

    class Trigger(models.TextChoices):
        BEAT = "BEAT", "Beat"
        MANUAL = "MANUAL", "Manual"
        RECOVERY = "RECOVERY", "Recovery"

    trigger = models.CharField(
        max_length=32,
        choices=Trigger.choices,
        default=Trigger.BEAT,
    )

    status = models.CharField(
        max_length=32,
        choices=Status.choices,
        default=Status.PENDING,
    )

    started_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    extraction_finished_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    cache_started_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    finished_at = models.DateTimeField(
        null=True,
        blank=True,
    )

    fortimanager_total = models.PositiveIntegerField(default=0)
    fortimanager_success = models.PositiveIntegerField(default=0)
    fortimanager_failed = models.PositiveIntegerField(default=0)

    adom_total = models.PositiveIntegerField(default=0)
    adom_success = models.PositiveIntegerField(default=0)
    adom_failed = models.PositiveIntegerField(default=0)
    adom_missing = models.PositiveIntegerField(default=0)

    previous_adom_total = models.PositiveIntegerField(default=0)
    current_adom_total = models.PositiveIntegerField(default=0)

    total_rules = models.PositiveBigIntegerField(default=0)

    error_message = models.TextField(
        blank=True,
        default="",
    )

    created_at = models.DateTimeField(
        auto_now_add=True,
    )
```

