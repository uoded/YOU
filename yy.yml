# 9. Rôle précis des champs du modèle `Adom`

`fortimanager` représente la FK vers le FortiManager actuel.

`source_fmg_uid` conserve définitivement l'identité historique du FortiManager, même si celui-ci est supprimé.

`name` contient le nom de l'ADOM.

`rules` contient le dernier dataset **entièrement valide** de règles.

`schema_version` indique le format du JSON.

`sync_status` représente l'état de la dernière synchronisation :

```text
SUCCESS
FAILED
MISSING
INACTIVE
```

`failure_reason` contient une raison synthétique d'échec.

`failed_packages` contient le détail structuré des packages ayant échoué.

`package_count` indique le nombre total de packages à traiter.

`successful_package_count` indique combien ont réussi.

`failed_package_count` indique combien ont échoué.

`rules_count` correspond au nombre de règles du dernier dataset valide.

`data_version` représente la version du dataset MySQL.

`cache_version` est une métadonnée indiquant la version que l'application considère comme publiée dans Redis.

`last_seen_at` représente la dernière fois où l'ADOM était présent dans une liste d'ADOMs FMG récupérée avec succès.

`last_attempt_at` représente la dernière tentative d'extraction.

`last_success_at` indique la dernière extraction totalement réussie.

`last_failed_at` indique le dernier échec.

`consecutive_missing_count` compte les absences successives.

`is_active` permet un soft-disable.

`deleted_at` indique le début du soft-delete.

`created_at` et `updated_at` sont purement techniques.

Important :

```text
updated_at ne doit jamais servir
à déterminer si un ADOM existe encore.
```

---

# 10. `rules` ne doit contenir que des données entièrement cohérentes

Pour un ADOM avec :

```text
PKG_A
PKG_B
PKG_C
PKG_D
```

si :

```text
A SUCCESS
B SUCCESS
C FAILED
D SUCCESS
```

alors :

```text
ADOM = FAILED
```

et :

```text
rules = ANCIEN JSON
```

Le nouveau contenu partiel :

```text
A + B + D
```

ne doit jamais remplacer l'ancien.

---

# 11. Préserver le contexte package dans les règles

Chaque règle doit garder son origine.

Exemple :

```json
{
  "package": "PKG_PROD",
  "vdom": "root",
  "policyid": 123,
  "name": "Allow_HTTP",
  "action": "accept"
}
```

Cela évite de considérer `policyid` comme unique à l'échelle de tout l'ADOM.

