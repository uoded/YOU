```

---

# 130. Test : cache legacy

Créer volontairement une clé historique :

```text
legacy:whatever
```

et vérifier qu'après :

```text
refresh
reconcile
cleanup
```

elle est toujours strictement identique.

---

# 131. Test : retries legacy

Vérifier également que les anciennes tâches conservent :

```text
leurs propres retries
leurs propres timeouts
leurs propres clients
```

---

# 132. Ce que nous n'implémentons pas : blocage sur baisse massive

Pas de :

```text
80 ADOM → 10
→ STOP
```

La baisse est seulement remontée dans le mail final.

---

# 133. Ce que nous n'implémentons pas : renouvellement des locks

Pas de :

```text
heartbeat
lock extension
watchdog
```

TTL fixe suffisamment large.

---

# 134. Ce que nous n'implémentons pas : verrou global FortiManager

On ne bloque jamais le FMG lui-même.

---

# 135. Ce que nous n'implémentons pas : adaptation du legacy

Aucune ancienne tâche ne sera forcée à :

```text
prendre nos locks
utiliser nos retries
utiliser nos timeouts
utiliser nos clés Redis
```

---

# 136. Ce que nous n'implémentons pas : cache partagé avec le legacy

Notre namespace reste :

```text
daily-policy-sync:
```

et doit rester exclusif.

---

# 137. Configuration recommandée

Les paramètres doivent être configurables :

```python
DAILY_POLICY_SYNC_HOUR = 14
DAILY_POLICY_SYNC_MINUTE = 2

DAILY_POLICY_MAX_RETRIES = 3

DAILY_POLICY_CONNECT_TIMEOUT = ...
DAILY_POLICY_READ_TIMEOUT = ...

DAILY_POLICY_EXTRACTION_LOCK_TTL = ...

DAILY_POLICY_CACHE_RECONCILE_INTERVAL = ...

ADOM_MISSING_THRESHOLD = 2

ADOM_SOFT_DELETE_RETENTION_DAYS = ...

DAILY_POLICY_REDIS_PREFIX = "daily-policy-sync"
```

Éviter les valeurs magiques dispersées dans le code.

---

# 138. Organisation applicative recommandée

Une structure propre pourrait être :

```text
daily_policy_sync/
│
├── models/
│   ├── adom.py
│   ├── sync_run.py
│   └── sync_result.py
│
├── services/
│   ├── fortimanager_client.py
│   ├── extractor.py
│   ├── validator.py
│   ├── persistence.py
│   ├── cache.py
│   ├── reconciler.py
│   ├── cleanup.py
│   ├── locks.py
│   └── reporting.py
│
├── tasks/
│   ├── extraction.py
│   ├── cache.py
│   ├── reconciliation.py
│   └── cleanup.py
│
├── selectors/
│   └── adoms.py
│
├── constants.py
├── exceptions.py
└── tests/
```

Ainsi la logique Celery ne devient pas un énorme fichier monolithique.

---

# 139. Responsabilité exacte des services

`fortimanager_client.py` :

```text
communication FMG uniquement
```

`extractor.py` :

```text
orchestration extraction ADOM/package
```

`validator.py` :

```text
validation stricte des réponses
```

`persistence.py` :

```text
écriture MySQL
```

`cache.py` :

```text
lecture/écriture Redis namespacée
```

`reconciler.py` :

```text
comparaison DB ↔ Redis
```

`cleanup.py` :

```text
nettoyage orphelins
```

`locks.py` :

```text
les 2 familles de locks
```

`reporting.py` :

```text
construction du mail final
```

---

